{{- if .Values.postgres.enabled }}
# PostgreSQL 初始化脚本 — 首次启动时自动执行
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hci-data.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Schema objects are reconciled by the db-migrate Job from desired_schema.sql.
    SET timezone = 'UTC';
{{- end }}
