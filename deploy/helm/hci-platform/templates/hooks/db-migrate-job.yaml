{{- if .Values.dbMigrate.enabled }}
# The PreSync Job reconciles the complete desired state with Ptah Compat.
# Existing databases run versioned data repairs before schema constraints change.
# Fresh databases bootstrap from desired_schema.sql before those repairs.
apiVersion: batch/v1
kind: Job
metadata:
  {{- $tag := .Values.dbMigrate.image.tag | default "latest" | lower | replace "." "-" | replace "_" "-" | trunc 15 | trimSuffix "-" }}
  {{- $chartVer := .Chart.Version | lower | replace "." "" }}
  name: db-migrate-{{ $tag }}-{{ $chartVer }}
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # D-011: 必须包含 HookFailed，否则 PreSync 失败后会残留 Job 并阻塞后续 re-sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookFailed
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db-migrate
        {{- include "hci.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.global.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody（postgres:15-alpine 默认用户）
        fsGroup: 65534
      # Create the separate atlas_dev scratch database for Ptah Compat.
      # Ptah rehearses the plan here before applying it to the target
      initContainers:
        - name: init-schema-dev
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # The scratch database uses the target server and extension binaries.
              psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -tc \
                "SELECT 1 FROM pg_database WHERE datname='atlas_dev';" \
                | grep -q 1 || \
                psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "CREATE DATABASE atlas_dev;"
              echo "Schema scratch database is ready"
          env:
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost .Values.config.postgresDb | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: db-migrate
          image: {{ .Values.dbMigrate.image.repository }}:{{ .Values.dbMigrate.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          # 使用镜像 ENTRYPOINT（/db-migrate.sh），无需覆盖 command
          env:
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost .Values.config.postgresDb | quote }}
            - name: DEV_URL
              value: {{ printf "postgres://%s:%s@%s:5432/atlas_dev?sslmode=disable" .Values.config.postgresUser (.Values.secrets.postgresPassword | urlquery) .Values.config.postgresHost | quote }}
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
