{{- if and .Values.dataLayer.manage .Values.postgres.enabled }}
# PostgreSQL 初始化脚本 — 首次启动时自动执行
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: {{ include "hci.namespace" . }}
  labels:
    {{- include "hci.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Schema objects are reconciled by the db-migrate Job from desired_schema.sql.
    SET timezone = 'UTC';
{{- end }}
