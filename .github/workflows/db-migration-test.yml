name: DB Schema verification

on:
  pull_request:
    branches: [main]
    paths:
      - "database/**"
      - "Dockerfile.migrations"
      - "atlas.hcl"
      - "scripts/db-migrate.sh"
      - "scripts/migration-runner.sh"
      - "scripts/verify-ptah-schema.sh"
      - "deploy/docker/docker-compose.yml"
      - "deploy/helm/hci-platform/templates/hooks/db-migrate-job.yaml"
      - "deploy/helm/**/templates/postgres/init-configmap.yaml"
      - ".github/workflows/db-migration-test.yml"
  push:
    branches: [feat/ptah-compat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-schema-declarative-test:
    name: Ptah Compat schema verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hci_test
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: hci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_test?sslmode=disable"
      DEV_URL: "postgres://hci_test:ci_test_pass@localhost:5432/atlas_dev?sslmode=disable"
      UPGRADE_DATABASE_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_upgrade?sslmode=disable"
      UPGRADE_DEV_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_upgrade_dev?sslmode=disable"
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build the migration runtime and verification target
        run: |
          docker --context default build --build-arg MIRROR_MODE=off \
            --target schema-test -f Dockerfile.migrations -t hci-db-migrate-verify .
      - name: Prepare disposable databases and unchanged upstream SQL
        run: |
          for db in atlas_dev hci_upgrade hci_upgrade_dev; do
            docker --context default run --rm --network host --entrypoint createdb \
              hci-db-migrate-verify --maintenance-db "$DATABASE_URL" "$db"
          done
          git show 4ca96cbf27f1d8d24c63429a596849a97ab9011e:database/desired_schema.sql \
            > "$RUNNER_TEMP/legacy_schema.sql"
          git show 4ca96cbf27f1d8d24c63429a596849a97ab9011e:database/desired_extras.sql \
            > "$RUNNER_TEMP/legacy_extras.sql"
          git show 4ca96cbf27f1d8d24c63429a596849a97ab9011e:database/data-migrations/035_bundle_factory_version_metadata.sql \
            > "$RUNNER_TEMP/legacy_migration_035.sql"
      - name: Verify fresh install, behavior, repeat, drift repair, and upgrade
        run: |
          docker --context default run --rm --network host --user 65534:65534 \
            -e DATABASE_URL -e DEV_URL -e UPGRADE_DATABASE_URL -e UPGRADE_DEV_URL \
            -v "$RUNNER_TEMP/legacy_schema.sql:/legacy_schema.sql:ro" \
            -v "$RUNNER_TEMP/legacy_extras.sql:/legacy_extras.sql:ro" \
            -v "$RUNNER_TEMP/legacy_migration_035.sql:/legacy_migration_035.sql:ro" \
            hci-db-migrate-verify
