name: HCI Ptah 0.11.1 接管复验

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hci_test
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: hci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HCI_TESTING: "1"
      DATABASE_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_test?sslmode=disable"
      DEV_URL: "postgres://hci_test:ci_test_pass@localhost:5432/atlas_dev?sslmode=disable"
      UPGRADE_DATABASE_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_upgrade?sslmode=disable"
      UPGRADE_DEV_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_upgrade_dev?sslmode=disable"
      INIT_DATABASE_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_init?sslmode=disable"
      INIT_DEV_URL: "postgres://hci_test:ci_test_pass@localhost:5432/hci_init_dev?sslmode=disable"
      # 固定首次接管前的原始版本；本工作流只作该补丁的可复现证据，不进入上游。
      PRE_PTAH_BASELINE: "4ca96cbf27f1d8d24c63429a596849a97ab9011e"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39a
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: 验证 diagnosis-service 全部单元测试
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest backend/diagnosis-service/tests/unit/ -n0 -q --no-cov -m 'not integration and not slow'
      - name: 提取原始验证输入
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          root = Path("proof/ptah-0.11.1")
          baseline = os.environ["PRE_PTAH_BASELINE"]
          for source, target in [
              ("database/desired_schema.sql", "legacy_schema.sql"),
              ("database/desired_extras.sql", "legacy_extras.sql"),
              ("database/data-migrations/035_bundle_factory_version_metadata.sql", "legacy_migration_035.sql"),
          ]:
              (root / target).write_bytes(subprocess.check_output(["git", "show", f"{baseline}:{source}"]))
          for chart, target in [("hci-platform", "legacy_init.sql"), ("hci-platform-data", "legacy_data_init.sql")]:
              text = subprocess.check_output(["git", "show", f"{baseline}:deploy/helm/{chart}/templates/postgres/init-configmap.yaml"], text=True)
              body = text.split("  init.sql: |\n", 1)[1]
              (root / target).write_text("\n".join(line[4:] if line.startswith("    ") else line for line in body.splitlines() if not line.startswith("{{")) + "\n")
          (root / "original_040.sql").write_bytes(subprocess.check_output(["git", "show", "289b3416:database/data-migrations/040_preserve_legacy_extras_repairs.sql"]))
      - name: 构建实际迁移镜像及独立验证镜像
        run: |
          docker --context default build --build-arg MIRROR_MODE=off -f Dockerfile.migrations -t hci-pr1107-review:runtime .
          docker --context default build -f proof/ptah-0.11.1/Dockerfile -t hci-pr1107-review:proof proof/ptah-0.11.1
          for db in atlas_dev hci_upgrade hci_upgrade_dev; do
            psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "CREATE DATABASE $db;"
          done
      - name: 验证新建、CHECK 回归、重复、修复、存量升级及原始 Helm init
        run: |
          docker --context default run --rm --network host --user 65534:65534 \
            -e DATABASE_URL -e DEV_URL -e UPGRADE_DATABASE_URL -e UPGRADE_DEV_URL \
            -e INIT_DATABASE_URL -e INIT_DEV_URL hci-pr1107-review:proof
      - name: 确认回归测试会拒绝旧 040
        run: |
          if docker --context default run --rm --network host --entrypoint sh -e DATABASE_URL \
            hci-pr1107-review:proof -c 'cp /original_040.sql /data-migrations/040_preserve_legacy_extras_repairs.sql; exec psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -f /verify-ptah-legacy-repairs.sql' \
            > "$RUNNER_TEMP/negative-control.log" 2>&1; then
            echo "旧 040 意外通过回归测试"
            exit 1
          fi
          cat "$RUNNER_TEMP/negative-control.log"
          grep -F '040 重建或收窄了后续 Schema 的 CHECK' "$RUNNER_TEMP/negative-control.log"
